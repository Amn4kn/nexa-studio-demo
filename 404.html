<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — Nexa Studio</title>
<link rel="icon" href="/nexa-studio-demo/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Manrope';font-weight:400 700;font-display:swap;src:url(/nexa-studio-demo/fonts/manrope-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:italic;font-display:swap;src:url(/nexa-studio-demo/fonts/instrumentserif-italic.woff2) format('woff2')}
html,body{margin:0;height:100%;background:#070b14;color:#e9edf5;font:400 18px/1.6 Manrope,system-ui,sans-serif}
main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}
p.code{font-family:'Instrument Serif',serif;font-style:italic;font-size:96px;color:#f3dfaa;margin:0;line-height:1}
h1{font-size:30px;margin:12px 0}p{color:#97a3ba;margin:0 0 24px}
a{display:inline-block;background:#d8b06a;color:#1a1205;font-weight:700;text-decoration:none;border-radius:999px;padding:12px 24px}
a:focus-visible{outline:3px solid #f3dfaa;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div>
    <p class="code">404</p>
    <h1>Cette page n'existe pas</h1>
    <p>Le lien est peut-être ancien ou mal copié.</p>
    <a href="/nexa-studio-demo/">Retour à l'accueil</a>
  </div>
</main>
</body>
</html>
